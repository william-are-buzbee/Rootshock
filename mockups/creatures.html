/* a cut-down copy of the game's look (shader.ts): faceted, shaded by facing, a room light, the flashlight from the eye,

const U = {

/* ---------------------------------------------------------------------------------------------------------------- */
/* eyes: a ball that turns in its socket to look, and a lid that does not (it comes down over the ball, or draws back) */
const EYES = [];
function eye(parent, r, x, y, z, o = {}) {

/** a sealed eye, the smallest heads': a puffed lid with a slit, never open */
function sealed(parent, r, x, y, z, skin) {

const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _e = new THREE.Vector3();

/* ---------------------------------------------------------------------------------------------------------------- */
/* a person for scale: 1.8 m */
function figure(parent, x, z, yaw) {

/* ================================================================================================================ */
/* THE OVERSEER: the operations staff grown into one body at their posts. A mound of them fused, a head that has
   budded heads like a tumour buds, each with eyes but the smallest, and every face turns together to whatever it
   attends to. A watcher at each screen behind it, joined to it by a cord of meat; two clubbed arms to knock with. */
function buildOverseer() {

  mk(S, 'box', 0x262a2e, 12, 4.2, 0.2, 0, 2.1, -4.75);
  mk(S, 'box', 0x3a3d40, 9.2, 0.06, 0.72, 0, 0.75, -4.12);
  mk(S, 'box', 0x24272a, 9.2, 0.7, 0.05, 0, 0.37, -3.78);
  mk(S, 'box', 0x2a2d30, 12, 0.92, 0.3, 0, 0.46, 3.3);

  const hEyes = [eye(hd, 0.1, -0.13, 0.08, 0.25, { skin: PALE, cover: 0.05 }), eye(hd, 0.105, 0.13, 0.06, 0.25, { skin: PALE, cover: 0.05 }), eye(hd, 0.06, 0.27, 0.22, 0.17, { skin: RAW, wild: 1 })];
  mk(hd, 'box', 0x1e0807, 0.26, 0.06, 0.05, 0, -0.16, 0.29);
  for (let k = 0; k < 4; k++) mk(hd, 'box', BONE, 0.04, 0.045, 0.03, -0.09 + k * 0.06, -0.135, 0.305);
  const heel = grp(palm, 0, -0.3, -0.75);

  return {
    S, g, root, palm, fingers, kHeads, wr, wr2, hd, hEyes, heel,
    room: [0.36, 0.37, 0.38], glow: { pos: V(0, -10, 0), c: [0, 0, 0], r: 1 },
    cam: { yaw: 0.65, pitch: 0.16, dist: 6.2, tgt: V(0, 0.95, 0) },
    fig: figure(S, -2.1, 0.4, 0.5),
    yawH: 0, pitchH: 0,
  };
}

/* ================================================================================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 80);
const OV = buildOverseer(), HA = buildHand();
let cur = OV;

/* ---- the overseer's moods ---- */
const ov = { mode: 'idle', t: 0, screen: -1, att: 0, stare: 0, code: null, flush: 0, shared: V(0, 1.5, 6) };
function ovKnock(zone, at) {
  const [name, n] = ZONES[zone];
  ov.code = { name, n, times: codeTimes(n).map(x => x + at), landed: 0 };
  showKnocks(n, 0, name);
}
const OV_STATES = {
  idle: ['Idle', 'Every face looks somewhere of its own and drifts. They blink out of step and the lids sit heavy. Now and then a small head glances back at a screen.'],
  wing: ['Seen: the wing', 'A watcher sees you on its screen and leans in. A lump runs down its cord to the body, and every face turns to that screen. Then the arms knock the wing\'s code into the floor, once, a pause, once more.'],
  atrium: ['Seen: the atrium', 'The same from the atrium\'s camera: the watcher, the lump down the cord, every face to the screen, then two knocks, a pause, two more.'],
  muster: ['Seen: the muster hall', 'Three knocks, a pause, three. The hand, wherever it is, feels it through the slab and goes.'],
  ops: ['Seen: Operations', 'Four, a pause, four: its own corridor.'],
  glass: ['Through the glass', 'It sees you itself. Every face turns from the screens to you and follows you as you move. The lids draw back, the pupils open, the whites flush. Shine the flashlight into an eye up close and its pupil pins.'],
};
const CAMS = { wing: 0, atrium: 1, muster: 2, ops: 3 };
function setOv(mode) {
  ov.mode = mode; ov.t = 0; ov.code = null; showKnocks(0);
  ov.screen = CAMS[mode] ?? -1;
  for (const s of OV.screens) s.hot = 0;
  if (mode === 'glass') ovKnock('ops', 1.0);
}
function stepOverseer(dt, now) {
  ov.t += dt;
  const M = OV, t = ov.t, cam = camera.position;
  /* the plan for this mode: who is tense, what all the faces look at, whether they stare */
  let attTo = 0, stare = 0, flush = 0;
  if (ov.screen >= 0) {
    const W = M.watchers[ov.screen], sc = M.screens[ov.screen];
    sc.hot = t < 12 ? 1 : 0;
    W.tense = t < 11 ? 1 : 0;
    const q = clamp((t - 0.35) / 0.9, 0, 1);
    W.lump.visible = q > 0 && q < 1;
    W.lump.position.lerpVectors(W.a, W.b, ease(q)); W.lump.position.y += Math.sin(q * PI) * 0.05;
    if (t > 1.1 && t < 11) { attTo = 1; stare = 1; flush = 0.6; ov.shared.copy(sc.pos); }
    if (t > 1.9 && !ov.code && t < 3) ovKnock(Object.keys(CAMS)[ov.screen], t + 0.05);
    if (t > 11.5) setOv('idle');
  } else if (ov.mode === 'glass') { attTo = 1; stare = 1; flush = 1; ov.shared.copy(cam); }
  ov.att += (attTo - ov.att) * damp(2.5, dt);
  ov.stare = stare;
  for (const [k, W] of M.watchers.entries()) {
    const tn = ov.screen === k && ov.t < 11 ? 1 : 0;
    W.lean.rotation.x += (tn * 0.32 + Math.sin(now * 0.7 + k) * 0.02 - W.lean.rotation.x) * damp(5, dt);
    W.lean.updateMatrixWorld(true);
    _w.copy(M.screens[k].pos); _w.y -= 0.05;
    lookEye(W.eye, _w, dt, { stare: tn, flush: tn, drowse: tn ? 0 : 0.15 });
  }
  for (const [k, s] of M.screens.entries()) {
    if (s.dead) continue;
    const f = s.hot ? (0.5 + 0.5 * (Math.floor(now * 3) % 2)) : 0;
    s.sm.uniforms.uTint.value.set(0.85, 0.12, 0.1, f * 0.85);
  }
  /* the knocks: each arm lifts and comes down on its beat, one then the other */
  if (ov.code) {
    const C = ov.code;
    while (C.landed < C.times.length && t >= C.times[C.landed]) { const a = M.arms[C.landed % 2]; a.t = 0; C.landed++; thud(1); showKnocks(C.n, C.landed, C.name); }
    if (C.landed >= C.times.length && t > C.times[C.times.length - 1] + 2.4) { ov.code = null; showKnocks(0); if (ov.mode === 'glass') { /* it keeps watching */ } }
  }
  for (const a of M.arms) {
    /* lift over the 0.32 s before the beat, slam in 0.07 s, a little bounce. a.t runs from the beat */
    const C = ov.code, idx = M.arms.indexOf(a);
    let up = 0;
    if (C) { const nxt = C.times.find((x, i) => i >= C.landed && i % 2 === idx); if (nxt !== undefined && nxt - t < 0.34) up = ease(1 - (nxt - t) / 0.34); }
    a.t += dt;
    const after = a.t < 0.25 ? Math.sin(a.t / 0.25 * PI) * 0.06 * (1 - a.t / 0.25) : 0;
    const want = 0.62 - up * 0.62 - after;
    a.A.rotation.x = up > 0 ? want : a.A.rotation.x + (want - a.A.rotation.x) * damp(a.t < 0.08 ? 60 : 6, dt);
    a.E.rotation.x = 0.55 - up * 0.35 + Math.sin(now * 0.8 + a.s) * 0.02;
  }
  /* breathing */
  const br = 1 + Math.sin(now * 0.9) * 0.018;
  M.body.scale.set(br, 1 / br, br);
  M.body.updateMatrixWorld(true);
  /* every face: a target of its own, drifting, or the one they all attend to; big heads come round slowly */
  for (const H of M.heads) {
    let want;
    if (ov.att > 0.05 && attTo) want = ov.shared;
    else {
      if ((H.glance -= dt) < 0) { H.gl = H.gl ? null : M.screens[Math.floor(rnd(0, 4))].pos; H.glance = H.gl ? rnd(1.2, 2.4) : rnd(5, 14); }
      const w = H.wander;
      want = H.gl ?? _w.set(Math.sin(now * w[0] + w[1]) * 4.5, 1.6 + Math.sin(now * w[2] + w[3]) * 1.4, 6 + Math.cos(now * w[0] * 0.7 + w[3]) * 2);
    }
    H.tgt.lerp(want, damp(H.lag * (attTo ? 2.2 : 1), dt));
    const [y, p] = aim(H.h, H.tgt);
    const cy = clamp(y - H.rest[0], -H.range, H.range) + H.rest[0], cp = clamp(p, -0.9, 0.9);
    H.yaw += (cy - H.yaw) * damp(H.lag * 2, dt); H.pitch += (cp - H.pitch) * damp(H.lag * 2, dt);
    H.h.rotation.set(H.pitch, H.yaw + (H.s < 0.3 && Math.random() < 0.01 ? rnd(-0.2, 0.2) : 0), 0);
    H.h.updateMatrixWorld(true);
    for (const E of H.eyes) lookEye(E, H.tgt, dt, { stare, flush });
  }
  for (const E of M.lone) lookEye(E, ov.att > 0.3 ? ov.shared : cam, dt, { stare, flush });
}

/* ---- the hand's moods ---- */
const hs = { mode: 'listen', t: 0, raise: 0, walk: 0, walkPh: 0, press: 0, code: null, strike: -1, droop: 0, shake: 0 };
const HA_STATES = {
  listen: ['Listening', 'Low, on its fingertips, with the heels of its hands on the floor. Its fingers twitch: it is feeling the slab. The two front heads look about at floor height. It stands 1.1 m at the knuckles; a bench hides it.'],
  knock: ['Knocked for', 'Three knocks, a pause, three: the muster hall. On each one its fingers press flat and the palm shudders. When the code is done it rises, turns, and goes.'],
  alert: ['Raised', 'The wrist comes up, the fingers curl into a claw under it, and the head at the end of the braided legs comes up over the hand and looks. It follows you round.'],
  go: ['Going', 'Raised, on its way to a zone. It walks on two sets of fingers at a time, index, ring and thumb, then middle and little.'],
  strike: ['Striking', 'Its blow: it rocks back onto the heel of its hand with the fingers lifted, then slaps the whole hand down flat in front of it.'],
  unlinked: ['Unlinked', 'The overseer is dead. Nothing knocks any more, so it roams at half height with its head down and the lids heavy. It would turn on whatever struck it.'],
};
function setHand(mode) {
  hs.mode = mode; hs.t = 0; hs.code = null; showKnocks(0);
  if (mode === 'knock') { const [name, n] = ZONES.muster; hs.code = { name, n, times: codeTimes(n).map(x => x + 0.6), landed: 0 }; showKnocks(n, 0, name); }
  if (mode === 'strike') hs.strike = 0;
}
function stepHand(dt, now) {
  hs.t += dt;
  const M = HA, cam = camera.position;
  let raise = 0, walk = 0, droop = 0, look = cam, stare = 0;
  switch (hs.mode) {
    case 'listen': look = _w.set(Math.sin(now * 0.4) * 3, 0.2, 3); break;
    case 'knock': {
      const C = hs.code;
      if (C) {
        while (C.landed < C.times.length && hs.t >= C.times[C.landed]) { C.landed++; hs.press = 1; thud(0.75, true); showKnocks(C.n, C.landed, C.name); }
        const end = C.times[C.times.length - 1];
        if (hs.t > end + 0.7) { raise = 1; stare = 1; look = _w.set(-3, 1.8, 4); }
        if (hs.t > end + 2.4) { walk = 1; }
        if (hs.t > end + 7) { showKnocks(0); setHand('go'); }
      }
      if (!(hs.t > (C?.times.at(-1) ?? 0) + 0.7)) look = _w.set(0, 0.0, 2);
      break;
    }
    case 'alert': raise = 1; stare = 1; break;
    case 'go': raise = 1; walk = 1; stare = 1; look = _w.set(Math.sin(now * 0.3) * 2, 1.6, 6); break;
    case 'strike': {
      raise = 1; stare = 1;
      if (hs.strike >= 0) { hs.strike += dt; if (hs.strike > 1.6) { hs.strike = -1; setHand('alert'); } }
      break;
    }
    case 'unlinked': raise = 0.35; walk = 0.45; droop = 1; look = _w.set(Math.sin(now * 0.23) * 3, 0.0, 2.5); break;
  }
  hs.raise += (raise - hs.raise) * damp(raise > hs.raise ? 2.6 : 1.8, dt);
  hs.walk += (walk - hs.walk) * damp(3, dt);
  hs.droop += (droop - hs.droop) * damp(1.5, dt);
  hs.press = Math.max(0, hs.press - dt * 3.5);
  const R = hs.raise, w = hs.walk, P = hs.press;
  hs.walkPh += dt * (droop ? 3.2 : 6.5) * w;

  /* the strike: e runs 0..1 up the wind-up (rock back on the heel, fingers up), then the slap (flat), then back */
  let wind = 0, flat = 0;
  if (hs.strike >= 0) {
    const s = hs.strike;
    if (s < 0.7) wind = ease(s / 0.7);
    else if (s < 0.8) { wind = 1 - (s - 0.7) / 0.1; flat = (s - 0.7) / 0.1; }
    else { flat = 1 - ease(clamp((s - 0.95) / 0.65, 0, 1)); if (s - dt < 0.8) { thud(1.1); hs.shake = 0.35; } }
  }

  /* the palm: knuckles stay put, the wrist rises; under the slap it lies flat */
  M.palm.rotation.x = lerp(lerp(-0.06, 0.92, R), -0.55, wind) * (1 - flat) + (-0.04) * flat - P * 0.06 + Math.sin(now * 23) * P * 0.03;
  M.palm.rotation.z = Math.sin(hs.walkPh) * 0.05 * w + Math.sin(now * 0.6) * 0.015;
  M.wr.rotation.x = lerp(lerp(-0.18, 0.82, R), 0.4, wind) - hs.droop * 0.25;
  M.wr2.rotation.x = lerp(-0.22, 0.28, R) + Math.sin(now * 1.1) * 0.04;
  M.fingers.forEach((F, k) => {
    const grpA = k === 0 || k === 2 || k === 4, ph = hs.walkPh + (grpA ? 0 : PI) + k * 0.15;
    F.lift = Math.pow(Math.max(0, Math.sin(ph)), 1.5) * w;
    const sw = Math.cos(ph) * w;
    const twitch = (1 - R) * (1 - w) * Math.sin(now * (7 + k * 1.7) + k * 2) * 0.05;
    let a1 = lerp(-0.95, -1.55, R), a2 = lerp(1.95, 1.85, R), a3 = lerp(0.75, 0.62, R);
    a1 += -F.lift * 0.55 + sw * 0.12 + P * 0.18; a2 += -F.lift * 0.45 - P * 0.12; a3 += twitch - P * 0.15;
    if (k === 4) { a1 = lerp(-0.1, -0.6, R) - F.lift * 0.4; a2 = 0.9 + twitch; a3 = 0.5; }
    a1 = lerp(a1, -0.85, wind); a2 = lerp(a2, 0.35, wind); a3 = lerp(a3, 0.2, wind);
    a1 = lerp(a1, 0.05, flat); a2 = lerp(a2, 0.12, flat); a3 = lerp(a3, 0.06, flat);
    F.kn.rotation.x = a1; F.j2.rotation.x = a2; F.j3.rotation.x = a3;
  });
  /* stand it on the floor: the lowest of the planted tips (and the heel, while it rocks or slaps) touches the ground */
  M.root.position.y = 0; M.root.position.z = Math.sin(hs.walkPh * 2) * 0.02 * w;
  M.g.updateMatrixWorld(true);
  let lo = Infinity;
  for (const F of M.fingers) if (F.lift < 0.08 || flat > 0) { F.tip.getWorldPosition(_v); lo = Math.min(lo, _v.y); }
  if (wind > 0 || flat > 0 || lo === Infinity) { M.heel.getWorldPosition(_v); lo = Math.min(lo, _v.y); }
  M.root.position.y = -lo + 0.02;
  M.g.position.x = hs.shake > 0 ? Math.sin(now * 90) * hs.shake * 0.05 : 0;
  hs.shake = Math.max(0, hs.shake - dt);
  M.g.updateMatrixWorld(true);
  /* the head at the wrist looks; the two front heads look too */
  const [y, p] = aim(M.hd, look);
  M.yawH += (clamp(y, -1.5, 1.5) - M.yawH) * damp(5, dt); M.pitchH += (clamp(p + hs.droop * 0.5, -1.2, 1.2) - M.pitchH) * damp(5, dt);
  M.hd.rotation.set(M.pitchH, M.yawH, Math.sin(now * 0.9) * 0.08);
  M.hd.updateMatrixWorld(true);
  const mood = { stare, flush: stare * 0.4, drowse: hs.droop * 0.7 };
  for (const E of M.hEyes) lookEye(E, look, dt, mood);
  for (const K of M.kHeads) {
    const [ky, kp] = aim(K.h, look);
    K.yaw += (clamp(ky, -0.6, 0.6) - K.yaw) * damp(6, dt); K.pitch += (clamp(kp, -0.5, 0.7) - K.pitch) * damp(6, dt);
    K.h.rotation.set(K.pitch, K.yaw, 0);
    K.h.updateMatrixWorld(true);
    for (const E of K.eyes) lookEye(E, look, dt, { ...mood, flush: 0 });
  }
}

/* ---- the panel ---- */
const btns = document.getElementById('btns'), stateEl = document.getElementById('state'), capEl = document.getElementById('cap');
function panel() {
  const ovr = cur === OV, S = ovr ? OV_STATES : HA_STATES, mode = ovr ? ov.mode : hs.mode;
  btns.innerHTML = '';
  for (const [k, [label]] of Object.entries(S)) {
    const b = document.createElement('button');
    b.textContent = ovr ? { idle: 'Idle', wing: 'Camera: wing', atrium: 'Camera: atrium', muster: 'Camera: muster hall', ops: 'Camera: Operations', glass: 'Through the glass' }[k] : { listen: 'Listen', knock: 'Knock: muster hall', alert: 'Raise', go: 'Go', strike: 'Strike', unlinked: 'Overseer dead' }[k];
    b.id = `b-${k}`;
    b.className = k === mode ? 'on' : '';
    b.onclick = () => { audio(); if (ovr) setOv(k); else setHand(k); panel(); };
    btns.appendChild(b);
  }
  stateEl.textContent = S[mode][0];
  capEl.textContent = S[mode][1];
}
let lastMode = '';
function sync() {
  const mode = cur === OV ? ov.mode : hs.mode;
  if (mode !== lastMode) { lastMode = mode; panel(); }
}
for (const b of document.querySelectorAll('nav button')) b.onclick = () => {
  cur = b.dataset.scene === 'hand' ? HA : OV;
  for (const x of document.querySelectorAll('nav button')) x.setAttribute('aria-selected', String(x === b));
  showKnocks(0); if (cur === OV) setOv('idle'); else setHand('listen');
  lastMode = ''; sync();
};
const flashEl = document.getElementById('flash'), figEl = document.getElementById('figure');
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') flashEl.checked = !flashEl.checked; });

/* ---- orbit ---- */
const ptrs = new Map(); let pinch = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); audio(); });
canvas.addEventListener('pointerup', e => { ptrs.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const C = cur.cam;
  if (ptrs.size === 1) { C.yaw -= (e.clientX - p[0]) * 0.006; C.pitch = clamp(C.pitch + (e.clientY - p[1]) * 0.005, -0.25, 1.35); }
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) C.dist = clamp(C.dist * pinch / d, 1.5, 16);
    pinch = d;
  }
});
canvas.addEventListener('wheel', e => { e.preventDefault(); cur.cam.dist = clamp(cur.cam.dist * Math.exp(e.deltaY * 0.001), 1.5, 16); }, { passive: false });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 64 : 50;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let prev = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - prev) / 1000), now = nowMs / 1000;
  prev = nowMs;
  const M = cur, C = M.cam;
  camera.position.set(C.tgt.x + Math.sin(C.yaw) * Math.cos(C.pitch) * C.dist, C.tgt.y + Math.sin(C.pitch) * C.dist, C.tgt.z + Math.cos(C.yaw) * Math.cos(C.pitch) * C.dist);
  camera.lookAt(C.tgt);
  /* the flashlight is held a little below and right of the eye */
  _v.set(0.18, -0.2, 0).applyQuaternion(camera.quaternion);
  U.uFlashPos.value.copy(camera.position).add(_v);
  U.uFlashDir.value.copy(C.tgt).sub(U.uFlashPos.value).normalize();
  U.uFlash.value = flashEl.checked ? 1 : 0;
  U.uRoom.value.set(...M.room);
  U.uGlowPos.value.copy(M.glow.pos); U.uGlowC.value.set(...M.glow.c); U.uGlowR.value = M.glow.r;
  U.uTime.value = now;
  M.fig.visible = figEl.checked;
  M.S.updateMatrixWorld(true);
  if (M === OV) stepOverseer(dt, now); else stepHand(dt, now);
  sync();
  renderer.render(M.S, camera);
  requestAnimationFrame(frame);
}
setOv('idle'); setHand('listen'); panel();
requestAnimationFrame(frame);
window.__rs = { OV, HA, ov, hs, setOv, setHand, camera, show: s => document.getElementById('tab-' + s).click() };
</script>
