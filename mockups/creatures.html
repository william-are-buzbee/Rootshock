/* a cut-down copy of the game's look (shader.ts): faceted, shaded by facing, a room light, the flashlight from the eye,

const VS = `attribute vec3 aCol; varying vec3 vW; varying vec3 vC;
void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vC = aCol; gl_Position = projectionMatrix * viewMatrix * w; }`;
const FS = `uniform vec3 uRoom; uniform vec3 uFlashPos; uniform vec3 uFlashDir; uniform float uFlash;
uniform vec3 uGlowPos; uniform vec3 uGlowC; uniform float uGlowR; uniform vec4 uTint; uniform float uTime; uniform float uFog;
varying vec3 vW; varying vec3 vC;
void main(){
  vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));
  vec3 tc = cameraPosition - vW; float d = length(tc); vec3 Ld = tc / max(d, 0.001);
  vec3 nf = dot(n, Ld) < 0.0 ? -n : n;
  vec3 base = vC; float em = 0.0;

  float sh = 0.55 + 0.45 * (abs(nf.y) * 0.95 + abs(nf.x) * 0.7 + abs(nf.z) * 0.5);
  vec3 light = uRoom * sh * (0.75 + 0.25 * max(nf.y, 0.0));
  vec3 tp = vW - uFlashPos; float fd = length(tp); vec3 fdir = tp / max(fd, 0.001);

  light += uFlash * vec3(1.0, 0.94, 0.82) * (cone * 2.5 + 0.05) * facing / (1.0 + 0.09 * fd * fd);

const MAT = material();

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------------------------------------------------------------------------------------------------------- */
/* eyes: a ball that turns in its socket to look. No lids, as the cast have none: a blink squeezes the ball flat, and an

const EYES = [];
function eye(parent, r, x, y, z, o = {}) {

/* sound: a knock is a thud through concrete; the building rings a little after it */

/* ---------------------------------------------------------------------------------------------------------------- */
/* a person for scale: 1.8 m */
function figure(parent, x, z, yaw) {

  g.rotation.y = yaw;

  mk(g, 'box', c, 0.44, 0.62, 0.24, 0, 1.17, 0);
  for (const s of [-1, 1]) mk(g, 'box', c, 0.1, 0.66, 0.11, s * 0.28, 1.15, 0);

function floor(parent, w, d, c, line, step) {

/* ================================================================================================================ */
/* THE OVERSEER: the operations staff grown into one body at their posts. A mound of them fused, a head that has
   budded three more like a tumour buds, and every face turns together to whatever it
   attends to. A watcher at each screen behind it, joined to it by a cord of meat; two clubbed arms to knock with. */
function buildOverseer() {
  const S = new THREE.Scene(), body = grp(S, 0, 0, 0);
  /* the room: floor, the back wall and its desk of screens, the glass onto the hall in front */
  floor(S, 12, 11, 0x303336, 0x232629, 1.2);
  mk(S, 'box', 0x262a2e, 12, 4.2, 0.2, 0, 2.1, -4.75);
  mk(S, 'box', 0x3a3d40, 9.2, 0.06, 0.72, 0, 0.75, -4.12);
  mk(S, 'box', 0x24272a, 9.2, 0.7, 0.05, 0, 0.37, -3.78);
  mk(S, 'box', 0x2a2d30, 12, 0.92, 0.3, 0, 0.46, 3.3);
  for (let x = -4.8; x <= 4.81; x += 1.6) mk(S, 'box', RIM, 0.09, 3.1, 0.12, x, 2.47, 3.3);

  for (const s of [-1, 1]) {

    for (let k = 0; k < 5; k++) { const m = mk(S, 'box', 0x141516, 0.6 + k * 0.08, 0.008, 0.025, s * 1.38, 0.006, 1.42); m.rotation.y = k * 1.26 + s; m.position.x += Math.cos(k * 1.26 + s) * 0.35 * s; m.position.z -= Math.sin(k * 1.26 + s) * 0.35; }
  }

  /* the mound: several of them, fused */
  for (const [x, y, z, sx, sy, sz, c] of [[0, 0.55, -0.1, 2.1, 1.3, 1.8, MEAT[0]], [0.6, 0.85, -0.4, 1.5, 1.25, 1.3, MEAT[2]], [-0.65, 0.8, -0.25, 1.35, 1.15, 1.25, MEAT[1]],

  for (const x of [-0.27, 0.77]) mk(body, 'ico', MEAT[2], 0.5, 0.38, 0.46, x, 1.3, 0.18);

    W.tense = t < 11 ? 1 : 0;
    const q = clamp((t - 0.35) / 0.9, 0, 1);
    W.lump.visible = q > 0 && q < 1;
    W.lump.position.lerpVectors(W.a, W.b, ease(q)); W.lump.position.y += Math.sin(q * PI) * 0.05;
    if (t > 1.1 && t < 11) { stare = 1; flush = 0.6; }
    if (t > 1.9 && !ov.code && t < 3) ovKnock(Object.keys(CAMS)[ov.screen], t + 0.05);
    if (t > 11.5) setOv('idle');
  } else if (ov.mode === 'glass') { attTo = 1; stare = 1; flush = 1; ov.shared.copy(cam); }
  ov.att += (attTo - ov.att) * damp(2.5, dt);
  ov.stare = stare;
  for (const [k, W] of M.watchers.entries()) {
    const tn = ov.screen === k && ov.t < 11 ? 1 : 0;
    W.lean.rotation.x += (tn * 0.32 + Math.sin(now * 0.7 + k) * 0.02 - W.lean.rotation.x) * damp(5, dt);
    W.lean.updateMatrixWorld(true);
    _w.copy(M.screens[k].pos); _w.y -= 0.05;
    lookEye(W.eye, _w, dt, { stare: tn, flush: tn, drowse: tn ? 0 : 0.15 });
  }
  for (const [k, s] of M.screens.entries()) {
    if (s.dead) continue;
    const f = s.hot ? (0.5 + 0.5 * (Math.floor(now * 3) % 2)) : 0;
    s.sm.uniforms.uTint.value.set(0.85, 0.12, 0.1, f * 0.85);
  }
  /* the knocks: each arm lifts and comes down on its beat, one then the other */
  if (ov.code) {
    const C = ov.code;
    while (C.landed < C.times.length && t >= C.times[C.landed]) { const a = M.arms[C.landed % 2]; a.t = 0; C.landed++; thud(1); showKnocks(C.n, C.landed, C.name); }
    if (C.landed >= C.times.length && t > C.times[C.times.length - 1] + 2.4) { ov.code = null; showKnocks(0); if (ov.mode === 'glass') { /* it keeps watching */ } }
  }
  for (const a of M.arms) {
    /* lift over the 0.32 s before the beat, slam in 0.07 s, a little bounce. a.t runs from the beat */
    const C = ov.code, idx = M.arms.indexOf(a);
    let up = 0;
    if (C) { const nxt = C.times.find((x, i) => i >= C.landed && i % 2 === idx); if (nxt !== undefined && nxt - t < 0.34) up = ease(1 - (nxt - t) / 0.34); }
    a.t += dt;
    const after = a.t < 0.25 ? Math.sin(a.t / 0.25 * PI) * 0.06 * (1 - a.t / 0.25) : 0;
    const want = 0.62 - up * 0.62 - after;
    a.A.rotation.x = up > 0 ? want : a.A.rotation.x + (want - a.A.rotation.x) * damp(a.t < 0.08 ? 60 : 6, dt);
    a.E.rotation.x = 0.55 - up * 0.35 + Math.sin(now * 0.8 + a.s) * 0.02;
  }
  /* breathing */
  const br = 1 + Math.sin(now * 0.9) * 0.018;
  M.body.scale.set(br, 1 / br, br);
  M.body.updateMatrixWorld(true);
  /* the husk crosses the hall and back; every face follows it, or you, each with its own lag and a little off */
  const wx = Math.sin(now * 0.14) * 4.6, wv = Math.cos(now * 0.14);
  M.walker.position.x = wx; M.walker.rotation.y = wv > 0 ? PI / 2 : -PI / 2;
  M.wl.forEach((l, k) => { l.rotation.x = Math.sin(now * 5 + k * PI) * 0.35; });
  const prey = ov.att > 0.5 ? cam : _v.set(wx, 1.6, 6.8);
  for (const H of M.heads) {
    _w.copy(prey).add(H.off);
    H.tgt.lerp(_w, damp(H.lag * (attTo ? 2 : 1), dt));
    const [y, p] = aim(H.h, H.tgt);
    const cy = clamp(y - H.rest[0], -H.range, H.range) + H.rest[0], cp = clamp(p, -0.7, 0.7);
    H.yaw += (cy - H.yaw) * damp(H.lag * 2, dt); H.pitch += (cp - H.pitch) * damp(H.lag * 2, dt);
    H.h.rotation.set(H.pitch, H.yaw, 0);
    H.h.updateMatrixWorld(true);
    for (const E of H.eyes) lookEye(E, H.tgt, dt, { stare, flush });
  }
  for (const L of M.legs) L.t.rotation.x = -reach(L, L.foot);
}

/* ---- the hand's moods ---- */
const hs = { mode: 'listen', t: 0, raise: 0, walk: 0, ph: 0, press: 0, code: null, strike: -1, droop: 0, shake: 0 };
const HA_STATES = {
  listen: ['Listening', 'Low, its fingers curled down with their tips on the slab in front and the hands of its tail laid flat behind it: it is feeling for the knock. The tail\'s eyes are rolled back; from most angles it is only a tail. The two eyes on their stalks peer along the floor.'],
  knock: ['Knocked for', 'Three knocks, a pause, three: the muster hall. On each one its fingers and hands press flat. When the code is done the stalks rise, the tail comes up over its back, the head on the end rolls its eyes down, and it goes.'],
  alert: ['Raised', 'The body lifts on its four. The fingers at the front stay curled down, tips just off the floor, working back and forth two and two; the stalked eyes stand over them. The tail comes up over its back, its arms hanging in front of its head.'],
  go: ['Going', 'Raised, on its way. It walks on the body\'s four, diagonal pairs together; the tail\'s arms reach ahead of it.'],
  strike: ['Striking', 'Its blow: the tail\'s arms go up and wide and the fingers rear up and out; then the tail plunges, the hands come down in front of it, and the fingers slam down on the floor after them.'],
  unlinked: ['Unlinked', 'The overseer is dead and nothing knocks. It roams slowly, the tail half up and its head hanging, the arms dragging. It would turn on whatever struck it.'],
};
function setHand(mode) {
  hs.mode = mode; hs.t = 0; hs.code = null; showKnocks(0);
  if (mode === 'knock') { const [name, n] = ZONES.muster; hs.code = { name, n, times: codeTimes(n).map(x => x + 0.6), landed: 0 }; showKnocks(n, 0, name); }
  if (mode === 'strike') hs.strike = 0;
}
const TAIL = [[-0.62, 0.5, 0.12, 0.06, 0.0], [0.95, 0.55, 0.4, 0.25, 0.15]];
function stepHand(dt, now) {
  hs.t += dt;
  const M = HA, cam = camera.position;
  let raise = 0, walk = 0, droop = 0, look = cam, stare = 0;
  switch (hs.mode) {
    case 'listen': look = _w.set(Math.sin(now * 0.4) * 2.5, 0.0, 3); break;
    case 'knock': {
      const C = hs.code, end = C ? C.times[C.times.length - 1] : 0;
      look = _w.set(0, 0.0, 2.5);
      if (C) {
        while (C.landed < C.times.length && hs.t >= C.times[C.landed]) { C.landed++; hs.press = 1; thud(0.75, true); showKnocks(C.n, C.landed, C.name); }
        if (hs.t > end + 0.7) { raise = 1; stare = 1; look = _w.set(-3, 1.6, 4); }
        if (hs.t > end + 2.6) walk = 1;
        if (hs.t > end + 7) { showKnocks(0); setHand('go'); }
      }
      break;
    }
    case 'alert': raise = 1; stare = 1; break;
    case 'go': raise = 1; walk = 1; stare = 1; look = _w.set(Math.sin(now * 0.3) * 2, 1.4, 6); break;
    case 'strike':
      raise = 1; stare = 1;
      if (hs.strike >= 0 && (hs.strike += dt) > 1.6) { hs.strike = -1; setHand('alert'); }
      break;
    case 'unlinked': raise = 0.45; walk = 0.5; droop = 1; look = _w.set(Math.sin(now * 0.23) * 3, 0.0, 2.5); break;
  }
  hs.raise += (raise - hs.raise) * damp(raise > hs.raise ? 2.4 : 1.6, dt);
  hs.walk += (walk - hs.walk) * damp(3, dt);
  hs.droop += (droop - hs.droop) * damp(1.5, dt);
  hs.press = Math.max(0, hs.press - dt * 3.5);
  const R = hs.raise, w = hs.walk, P = hs.press, D = hs.droop;
  hs.ph += dt * (D > 0.5 ? 3 : 5.5) * w;
  /* the strike: wind (arms up and wide, fingers flared), slam (the tail plunges, hands down, fingers shut), then back */
  let wind = 0, slam = 0;
  if (hs.strike >= 0) {
    const s = hs.strike;
    if (s < 0.65) wind = ease(s / 0.65);
    else if (s < 0.78) { const q = (s - 0.65) / 0.13; wind = 1 - q; slam = q; }
    else { slam = 1 - ease(clamp((s - 0.95) / 0.65, 0, 1)); if (s - dt < 0.78) { thud(1.1); hs.shake = 0.35; } }
  }
  /* the body: low and nose down, listening; up on its four, raised */
  const h = lerp(0.36, 0.74, R) - P * 0.06 + Math.sin(hs.ph * 2) * 0.025 * w - slam * 0.1;
  M.body.position.set(hs.shake > 0 ? Math.sin(now * 90) * hs.shake * 0.04 : 0, h, slam * 0.18 + Math.sin(hs.ph * 2) * 0.02 * w);
  M.body.rotation.set(lerp(0.08, -0.08, R) - wind * 0.1 + slam * 0.15, Math.sin(now * 0.5) * 0.04, Math.sin(hs.ph) * 0.04 * w);
  hs.shake = Math.max(0, hs.shake - dt);
  /* the tail: along the floor, or up over the back; it plunges in the strike, and hangs when nothing calls it */
  M.tail.forEach((T, i) => { T.rotation.x = lerp(TAIL[0][i], TAIL[1][i], R) - D * [0, 0.25, 0.25, 0.25, 0.2][i] + Math.sin(now * 1.1 - i * 0.6) * 0.035 * (0.3 + R) - wind * [0.1, 0.1, 0.05, 0, 0][i] + slam * [0.25, 0.35, 0.35, 0.3, 0.2][i]; });
  M.g.updateMatrixWorld(true);
  /* its four walk: each foot on the floor pushes back, then lifts and swings forward; diagonal pairs together */
  for (const L of M.legs) {
    const u = (((hs.ph + L.ph) / TAU) % 1 + 1) % 1, st = 0.2 * w;
    let z = 0, y = 0;
    if (u < 0.62) z = lerp(st, -st, u / 0.62);
    else { const q = (u - 0.62) / 0.38; z = lerp(-st, st, q); y = Math.sin(q * PI) * 0.16 * w; }
    _w.set(L.rest.x * lerp(1, 0.86, R), y, L.rest.z + z);
    M.g.localToWorld(_w);
    L.t.rotation.x = -reach(L, _w);
  }
  /* the fingers: curled down like nails on a table, the knuckles arched up over the body. Listening, the tips rest on
     the slab and feel it; raised, they lift a little and work back and forth, two and two. Each reaches for its tip
     from above, and the last joint hangs straight down to it */
  for (const F of M.fingers) {
    const o = now * lerp(2.2, 3.4, R) + (F.i % 2 ? PI : 0) + F.i * 0.3, amp = lerp(0.035, 0.12, R);
    let x = F.x * 1.2, y = lerp(0, 0.3, R) + Math.max(0, Math.cos(o)) * lerp(0.015, 0.09, R), z = lerp(1.24, 1.3, R) + Math.sin(o) * amp;
    y -= P * 0.03;
    x = lerp(x, F.x * 1.9, wind); y = lerp(y, h + 0.5, wind); z = lerp(z, 0.95, wind);
    x = lerp(x, F.x * 0.8, slam); y = lerp(y, 0, slam); z = lerp(z, 1.6, slam);
    _w.set(x, Math.max(0, y) + F.L3, z); M.g.localToWorld(_w);
    F.t.rotation.x = PI / 2 - reach(F, _w);
  }
  /* the stalks stand straight up, swaying; they lean a little toward what they watch, and sag when nothing calls */
  for (const T of M.stalks) {
    const b = Math.sin(now * 1.3 + T.ph) * 0.06;
    T.st.rotation.set(-PI / 2 + b + D * 0.45, Math.sin(now * 0.6 + T.ph) * 0.12, 0);
    T.s2.rotation.set(-b * 1.5 + D * 0.3, 0, 0);
  }
  /* the tail's arms: flat on the floor by its head, listening; hanging in front of it, raised; up and wide, then down */
  M.g.updateMatrixWorld(true);
  const H = M.hd.getWorldPosition(M.HP);
  for (const A of M.arms) {
    const sw = Math.sin(hs.ph + (A.s > 0 ? PI : 0)) * 0.15 * w;
    let x = lerp(H.x + A.s * 0.55, H.x + A.s * 0.36, R), y = lerp(0.0, H.y - 0.65, R) + Math.abs(sw) * 0.5, z = lerp(H.z + 0.1, H.z + 0.55, R) + sw;
    y -= P * 0.02;
    x = lerp(x, H.x + A.s * 0.8, wind); y = lerp(y, H.y + 0.35, wind); z = lerp(z, H.z - 0.1, wind);
    x = lerp(x, A.s * 0.2, slam); y = lerp(y, 0.03, slam); z = lerp(z, 1.5, slam);
    _w.set(x, Math.max(0, y), z);
    const a = reach(A, _w);
    A.t.rotation.x = lerp(0, 1.1, R * (1 - slam)) - a;
    A.end.forEach((f, k) => { f.rotation.x = lerp(0.05, 0.9, R * (1 - slam)) + (1 - R) * Math.sin(now * (6 + k * 1.3) + k + A.s) * 0.12 - P * 0.1; });
  }
  /* the stalked eyes always look; the head on the tail only once it is up, its eyes rolled back till then */
  const mood = { stare, flush: stare * 0.4, drowse: D * 0.7 };
  M.g.updateMatrixWorld(true);
  for (const T of M.stalks) lookEye(T.E, look, dt, mood);
  const up = R > 0.55;
  const [hy, hp] = aim(M.hd, look);
  M.hy += ((up ? clamp(hy, -1.3, 1.3) : 0) - M.hy) * damp(4, dt); M.hp += ((up ? clamp(hp, -1.0, 1.0) : 0.3) + D * 0.6 - M.hp) * damp(4, dt);
  M.hd.rotation.set(M.hp, M.hy, Math.sin(now * 0.9) * 0.06);
  M.hd.updateMatrixWorld(true);
  for (const E of M.hEyes) lookEye(E, look, dt, { ...mood, shut: !up });
}

/* ---- the panel ---- */
const btns = document.getElementById('btns'), stateEl = document.getElementById('state'), capEl = document.getElementById('cap');
function panel() {
  const ovr = cur === OV, S = ovr ? OV_STATES : HA_STATES, mode = ovr ? ov.mode : hs.mode;
  btns.innerHTML = '';
  for (const [k, [label]] of Object.entries(S)) {
    const b = document.createElement('button');
    b.textContent = ovr ? { idle: 'Idle', wing: 'Camera: wing', atrium: 'Camera: atrium', muster: 'Camera: muster hall', ops: 'Camera: Operations', glass: 'Through the glass' }[k] : { listen: 'Listen', knock: 'Knock: muster hall', alert: 'Raise', go: 'Go', strike: 'Strike', unlinked: 'Overseer dead' }[k];
    b.id = `b-${k}`;
    b.className = k === mode ? 'on' : '';
    b.onclick = () => { audio(); if (ovr) setOv(k); else setHand(k); panel(); };
    btns.appendChild(b);
  }
  stateEl.textContent = S[mode][0];
  capEl.textContent = S[mode][1];
}
let lastMode = '';
function sync() {
  const mode = cur === OV ? ov.mode : hs.mode;
  if (mode !== lastMode) { lastMode = mode; panel(); }
}
for (const b of document.querySelectorAll('nav button')) b.onclick = () => {
  cur = b.dataset.scene === 'hand' ? HA : OV;
  for (const x of document.querySelectorAll('nav button')) x.setAttribute('aria-selected', String(x === b));
  showKnocks(0); if (cur === OV) setOv('idle'); else setHand('listen');
  lastMode = ''; sync();
};
const flashEl = document.getElementById('flash'), figEl = document.getElementById('figure');
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') flashEl.checked = !flashEl.checked; });

/* ---- orbit ---- */
const ptrs = new Map(); let pinch = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); audio(); });
canvas.addEventListener('pointerup', e => { ptrs.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const C = cur.cam;
  if (ptrs.size === 1) { C.yaw -= (e.clientX - p[0]) * 0.006; C.pitch = clamp(C.pitch + (e.clientY - p[1]) * 0.005, -0.25, 1.35); }
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) C.dist = clamp(C.dist * pinch / d, 1.5, 16);
    pinch = d;
  }
});
canvas.addEventListener('wheel', e => { e.preventDefault(); cur.cam.dist = clamp(cur.cam.dist * Math.exp(e.deltaY * 0.001), 1.5, 16); }, { passive: false });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 64 : 50;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let prev = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - prev) / 1000), now = nowMs / 1000;
  prev = nowMs;
  const M = cur, C = M.cam;
  camera.position.set(C.tgt.x + Math.sin(C.yaw) * Math.cos(C.pitch) * C.dist, C.tgt.y + Math.sin(C.pitch) * C.dist, C.tgt.z + Math.cos(C.yaw) * Math.cos(C.pitch) * C.dist);
  camera.lookAt(C.tgt);
  /* the flashlight is held a little below and right of the eye */
  _v.set(0.18, -0.2, 0).applyQuaternion(camera.quaternion);
  U.uFlashPos.value.copy(camera.position).add(_v);
  U.uFlashDir.value.copy(C.tgt).sub(U.uFlashPos.value).normalize();
  U.uFlash.value = flashEl.checked ? 1 : 0;
  U.uRoom.value.set(...M.room);
  U.uGlowPos.value.copy(M.glow.pos); U.uGlowC.value.set(...M.glow.c); U.uGlowR.value = M.glow.r;
  U.uTime.value = now;
  M.fig.visible = figEl.checked;
  M.S.updateMatrixWorld(true);
  if (M === OV) stepOverseer(dt, now); else stepHand(dt, now);
  sync();
  renderer.render(M.S, camera);
  requestAnimationFrame(frame);
}
setOv('idle'); setHand('listen'); panel();
requestAnimationFrame(frame);
window.__rs = { OV, HA, ov, hs, setOv, setHand, camera, show: s => document.getElementById('tab-' + s).click() };
</script>
